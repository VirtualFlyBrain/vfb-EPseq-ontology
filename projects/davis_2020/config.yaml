# Davis et al. 2020, TAPIN-seq / INTACT: nuclei affinity-purified from adult heads by a driver's tagged nuclear
# envelope protein (UNC84-GFP), mostly optic lobe neurons.
project: davis_2020
source:
  geo_series: GSE116969
  bioproject: PRJNA480794
  expression_atlas: E-GEOD-116969
  publication: FlyBase:FBrf0244935
  first_author: Davis
  year: 2020
dataset:
  label_prefix: Bulk RNA-seq data from   # -> "Bulk RNA-seq data from Davis (2020)"; TAPIN-seq / INTACT in the title
  assay_type: FBcv:0009018    # cell type-specific RNA-sequencing analysis
  title: A study using TAPIN RNA sequencing to build high resolution transcriptomes from selected adult optic lobe neurons.
  licence: CC-BY-4.0
  # output file names (VFB_EPseq_<name>.owl, VFB_EPseq_exp_<name>_<n>.owl.gz): VFB's
  # collectdata and dumps-prep load VFB_EPseq_PR* / VFB_EPseq_exp_*
  output_name: PRJNA480794
samples:
  # every loaded sample: whole heads (GEO "tissue: head"), adult
  tissue: FBbt:00000004
  stage: FBdv:00005369
  drivers: drivers.tsv
  driver_field: external driver id     # GEO characteristic naming the driver (drivers.tsv)
  driver_type_field: driver type
  # authors' cell type: the title before _d<n> (Davis 2020 supplementary table A, celltype), e.g.
  # Dm12_d1_rep1 -> Dm12, T4.T5_d1_female_rep1 -> T4.T5
  cell_types: cell_types.tsv
  cell_type_pattern: '^(?P<cell_type>.+?)_d\d+(?:_|$)'
  # GEO "driver type" values not loaded, with the reason
  exclude_driver_types:
    control: TAPIN controls (no driver; external driver id NA)
    dissected: >-
      bulk RNA from dissected lamina / optic lobe (GEO protocol bulk, no reporter): not
      captured by the driver (SS00796, SS55439), so not instances of its expression pattern
expression:
  # GEO supplementary table, identical to the 2024 curation's input (PRJNA480794_tpm.tsv)
  tpm_file: GSE116969_dataTable2.genes_x_samples_TPM.all_genes.txt.gz
  value: TPM          # expression_level; genes with TPM 0 are left out
  samples_per_file: 100
